<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8EEDF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Huddle">
<title>Huddle</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<style>
/* ================= Tokens: warm glass, light ================= */
:root{
  --bg-1:#FBF5EC; --bg-2:#F5E7D3; --blob-1:#FFD9A8; --blob-2:#FFC9B5; --blob-3:#F9E6B8;
  --glass:rgba(255,251,245,.66); --glass-strong:rgba(255,252,248,.86); --glass-edge:rgba(255,255,255,.8);
  --line:rgba(120,80,40,.12); --shadow:0 10px 30px -12px rgba(120,70,20,.28), 0 2px 6px rgba(120,70,20,.06);
  --shadow-lg:0 24px 60px -20px rgba(110,60,15,.38);
  --ink:#3A2A1B; --ink-2:#6E5741; --ink-3:#A08A73;
  --amber:#E8913A; --amber-2:#D2741F; --amber-soft:#FCE6CB;
  --going:#3F9663; --going-soft:#DDF0E2; --cant:#C9573F; --cant-soft:#F8DED6; --maybe:#D69A22; --maybe-soft:#FBEFCF;
  --r-sm:12px; --r:20px; --r-lg:28px;
  --tap:56px; --gap:0px; --top-extra:0px;
  --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --spring:cubic-bezier(.2,.9,.25,1.15); --ease:cubic-bezier(.25,.8,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{background-color:#FBF5EC;background:linear-gradient(170deg,var(--bg-1),var(--bg-2));background-attachment:fixed}
body{font-family:var(--font);color:var(--ink);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-text-size-adjust:100%}
.standalone{--top-extra:26px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font-size:17px}
.bgfx{position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(60px);opacity:.75}
.bgfx i{position:absolute;border-radius:50%;animation:drift 26s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:55vmax;height:55vmax;left:-10%;top:-5%;background:var(--blob-1)}
.bgfx i:nth-child(2){width:45vmax;height:45vmax;right:-8%;top:30%;background:var(--blob-2);animation-delay:-8s;animation-duration:32s}
.bgfx i:nth-child(3){width:50vmax;height:50vmax;left:20%;bottom:-20%;background:var(--blob-3);animation-delay:-16s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.08)}}

.glass{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border-radius:var(--r)}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.hidden{display:none!important}

/* ================= Header ================= */
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px + var(--top-extra)) 0 10px;
  background:linear-gradient(to bottom,rgba(251,245,236,.92),rgba(251,245,236,.7) 70%,rgba(251,245,236,0));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:48px}
.logo{display:flex;align-items:center;gap:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.logo .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#F6A84E,#DC7424);display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(200,100,20,.6);transition:transform .3s var(--spring)}
.logo.pressing .mark{transform:scale(.88)}
.logo .word{font-size:26px;font-weight:850;letter-spacing:-.02em}
.top .spacer{flex:1}
.iconbtn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;transition:transform .2s var(--spring),background .2s}
.iconbtn:active{transform:scale(.9)}
.iconbtn.glass{border-radius:16px}
.adminpill{font-size:13px;font-weight:800;color:#fff;background:var(--amber-2);padding:6px 12px;border-radius:99px}

/* ================= Views ================= */
main{padding-bottom:calc(env(safe-area-inset-bottom) + 120px + var(--gap))}
.view{animation:viewIn .42s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px;font-size:20px;font-weight:800}
.section-title small{font-size:15px;font-weight:600;color:var(--ink-3)}

/* Needs your answer strip */
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 10px;margin:0 -18px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.needs{flex:0 0 auto;width:min(78%,300px);scroll-snap-align:start;display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.needs .emo{font-size:34px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.needs b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.needs span{font-size:15px;color:var(--amber-2);font-weight:700}

/* Event cards */
.cards{display:grid;gap:16px}
@media (min-width:600px){.cards{grid-template-columns:1fr 1fr}}
@media (min-width:860px){
  .wrap{max-width:1180px;padding:0 28px}
  .cards{grid-template-columns:repeat(3,1fr);gap:20px}
  .card .art{height:clamp(130px,24vh,190px)}
  .evgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
  .evgrid .hero{position:sticky;top:calc(env(safe-area-inset-top) + 80px + var(--top-extra));margin-top:6px}
  .evgrid .tabs{margin-top:6px}
  .composer .wrap{max-width:1180px}
  .fab{right:max(28px,calc((100vw - 1180px)/2 + 28px))}
}
@media (min-width:1200px){.cards{grid-template-columns:repeat(4,1fr)}}
.card{overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;padding:0;transition:transform .25s var(--spring),box-shadow .25s}
.card:active{transform:scale(.98)}
.card .art{height:clamp(120px,22vh,170px)}
.card .body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.card .body .row{margin-top:auto;padding-top:12px}
.card h3{font-size:21px;line-height:1.2}
.card .when{margin-top:4px;font-size:16px;color:var(--ink-2);font-weight:600}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px;flex-wrap:wrap;row-gap:8px}
.stack .more{white-space:nowrap}
.stagger>*{animation:cardIn .5s var(--spring) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(n+5){animation-delay:.2s}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* Art */
.art{position:relative;overflow:hidden;display:grid;place-items:center}
.art .big{font-size:clamp(64px,13vh,92px);filter:drop-shadow(0 10px 14px rgba(80,40,10,.25));animation:bob 5s ease-in-out infinite}
.art .deco{position:absolute;font-size:22px;opacity:.85;animation:float 7s ease-in-out infinite}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.55),transparent 45%)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes float{50%{transform:translateY(-10px) rotate(8deg)}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:750;padding:7px 12px;border-radius:99px;white-space:nowrap}
.chip.going{background:var(--going-soft);color:var(--going)} .chip.cant{background:var(--cant-soft);color:var(--cant)}
.chip.maybe{background:var(--maybe-soft);color:#A77310} .chip.ask{background:var(--amber);color:#fff}
.chip.soft{background:rgba(255,255,255,.7);color:var(--ink-2)}
.count{position:absolute;top:12px;right:12px;z-index:1}

/* Avatars */
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none;border:2px solid #fff;box-shadow:0 2px 6px rgba(80,40,10,.15)}
.av.lg{width:64px;height:64px;font-size:24px;border-width:3px}
.av.pic{background-size:cover;background-position:center}
.av.xl{width:132px;height:132px;font-size:46px;border-width:4px;margin:0 auto}
.me-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.me-card .cam{position:relative}
.me-card .cam i{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;border:2px solid #fff;font-style:normal}
.crop{width:260px;height:260px;border-radius:50%;overflow:hidden;position:relative;margin:4px auto 16px;background:#eee;touch-action:none;box-shadow:0 0 0 4px #fff,0 10px 30px -10px rgba(110,60,15,.5);cursor:grab}
.crop img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none}
.zoom{width:100%;accent-color:var(--amber);margin:4px 0 6px}
.pinkb{position:absolute;opacity:0;width:1px;height:1px;font-size:16px;border:0;padding:0;left:50%;top:0}
.kbswitch{display:block;margin:16px auto 0;color:var(--amber-2);font-weight:750;font-size:16px;min-height:44px;padding:0 12px}
.sheet.kb .pad{display:none}
.stack{display:flex;align-items:center}
.stack .av{width:32px;height:32px;font-size:12px;margin-left:-9px}
.stack .av:first-child{margin-left:0}
.stack .more{margin-left:6px;font-size:14px;font-weight:700;color:var(--ink-2)}

/* FAB */
.fab{position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:calc(env(safe-area-inset-bottom) + 22px + var(--gap));z-index:30;width:68px;height:68px;border-radius:24px;
  background:linear-gradient(145deg,#F6A84E,#D9701F);color:#fff;display:grid;place-items:center;box-shadow:0 16px 30px -10px rgba(200,100,20,.7);transition:transform .25s var(--spring)}
.fab:active{transform:scale(.9) rotate(-8deg)}

/* Buttons */
.btn{min-height:var(--tap);padding:0 22px;border-radius:18px;font-weight:800;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--spring),filter .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(145deg,#F2A04A,#D9701F);color:#fff;box-shadow:0 10px 22px -10px rgba(200,100,20,.75)}
.btn.ghost{background:rgba(255,255,255,.7);border:1px solid var(--line)}
.btn.danger{background:var(--cant-soft);color:var(--cant)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--amber-2);font-weight:750}

/* Event view */
.backbar{display:flex;align-items:center;gap:6px}
.hero{overflow:hidden;margin-top:6px}
.hero .art{height:clamp(140px,24vh,230px)}
.hero .body{padding:18px}
.hero h1{font-size:28px;line-height:1.15}
.hero .meta{margin-top:10px;display:grid;gap:8px;font-size:17px;color:var(--ink-2)}
.hero .meta div{display:flex;gap:10px;align-items:flex-start}
.hero .meta svg{flex:none;margin-top:2px}
.hero .notes{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.6);white-space:pre-wrap;font-size:16px}
.tabs{display:flex;padding:5px;gap:5px;margin:18px 0 6px;border-radius:18px}
.tabs button{flex:1;min-height:48px;border-radius:14px;font-weight:800;font-size:17px;color:var(--ink-2);transition:all .3s var(--ease);position:relative}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px -4px rgba(110,60,15,.25)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--amber);color:#fff;font-size:13px;margin-left:6px}
.panel{padding:16px;margin-top:14px}
.panel h2{font-size:19px;margin-bottom:12px}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ans{min-height:76px;border-radius:18px;background:rgba(255,255,255,.7);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:16px;line-height:1.1;text-align:center;padding:6px;transition:transform .25s var(--spring),background .25s,border-color .25s,color .25s}
.ans .i{font-size:24px}
.ans:active{transform:scale(.94)}
.ans.on.going{background:var(--going);color:#fff;border-color:var(--going)}
.ans.on.cant{background:var(--cant);color:#fff;border-color:var(--cant)}
.ans.on.maybe{background:var(--maybe);color:#fff;border-color:var(--maybe)}
.ans.pop{animation:pop .45s var(--spring)}
@keyframes pop{40%{transform:scale(1.08)}}
.answers.sm .ans{min-height:56px;font-size:15px}.answers.sm .ans .i{font-size:18px}
.toggle-row{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.6);min-height:var(--tap)}
.toggle-row .t{flex:1;font-weight:700}
.toggle-row .t small{display:block;font-weight:600;color:var(--ink-3);font-size:14px}
.sw{width:60px;height:36px;border-radius:99px;background:#E4D6C4;position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.sw.on{background:var(--going)} .sw.on::after{transform:translateX(24px)}
.dep{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.dep .lbl{display:flex;align-items:center;gap:10px;font-weight:750;margin-bottom:10px}
.group{margin-bottom:14px}
.group h4{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.group h4 .dot{width:10px;height:10px;border-radius:50%}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:99px;background:rgba(255,255,255,.7);font-weight:700;font-size:16px;min-height:44px}
.person small{color:var(--ink-3);font-weight:600;font-size:13px}
.person.tap:active{transform:scale(.96)}

/* Date options */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.7);border:2px solid transparent;transition:transform .35s var(--spring),border-color .25s,background .25s;text-align:left;width:100%}
.opt.on{border-color:var(--going);background:#F4FBF5}
.opt .cal{width:58px;flex:none;border-radius:14px;overflow:hidden;text-align:center;background:#fff;box-shadow:0 2px 6px rgba(80,40,10,.1)}
.opt .cal .m{background:var(--cant);color:#fff;font-size:12px;font-weight:800;padding:3px 0;text-transform:uppercase;letter-spacing:.06em}
.opt .cal .d{font-size:24px;font-weight:850;padding:2px 0 4px}
.opt .info{flex:1;min-width:0}
.opt .info b{display:block;font-size:17px}
.opt .info span{font-size:15px;color:var(--ink-2)}
.opt .check{width:40px;height:40px;border-radius:50%;border:2.5px solid #D9C7B1;display:grid;place-items:center;flex:none;transition:all .3s var(--spring)}
.opt.on .check{background:var(--going);border-color:var(--going);transform:scale(1.05)}
.opt.top{box-shadow:0 0 0 3px var(--amber-soft)}
.best{font-size:12px;font-weight:850;color:var(--amber-2);text-transform:uppercase;letter-spacing:.05em}
.lockrow{display:flex;gap:10px;margin-top:10px}

/* Chat */
.chat{display:flex;flex-direction:column;gap:8px;padding:12px 0 16px;min-height:40vh}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%;animation:msgIn .35s var(--spring) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.97)}}
.msg .bub{padding:10px 14px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:0 2px 8px -2px rgba(110,60,15,.15);white-space:pre-wrap;word-wrap:break-word;font-size:17px}
.msg .who{font-size:13px;font-weight:800;color:var(--ink-2);margin:0 0 3px 6px}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg.mine .bub{background:linear-gradient(145deg,#F2A04A,#DD7A26);color:#fff;border-color:transparent}
.msg .bub.gone{background:transparent;color:var(--ink-3);font-style:italic;box-shadow:none;border:1px dashed var(--line)}
.daysep{text-align:center;font-size:13px;font-weight:800;color:var(--ink-3);margin:10px 0 2px}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 0 calc(env(safe-area-inset-bottom) + 10px + var(--gap));background:linear-gradient(to top,rgba(248,236,220,.97),rgba(248,236,220,.85));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.composer .wrap{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:22px;padding:13px 16px;background:#fff;max-height:140px;min-height:50px;outline:none;line-height:1.3}
.composer .send{width:52px;height:52px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;flex:none;transition:transform .2s var(--spring)}
.composer .send:active{transform:scale(.88)}
.chat-empty{text-align:center;padding:40px 10px;color:var(--ink-3);font-weight:600}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(60,35,10,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .25s both}
.scrim.out{animation:fadeOut .22s both}
@keyframes fade{from{opacity:0}} @keyframes fadeOut{to{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:calc(100dvh - env(safe-area-inset-top) - 16px);overflow:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#FFFBF5,#FBF1E3);border-radius:30px 30px 0 0;box-shadow:var(--shadow-lg);padding:10px 20px calc(env(safe-area-inset-bottom) + 22px + var(--gap));animation:sheetIn .5s var(--spring) both;max-width:640px;margin:0 auto}
.sheet.out{animation:sheetOut .25s var(--ease) both}
@keyframes sheetIn{from{transform:translateY(100%)}} @keyframes sheetOut{to{transform:translateY(100%)}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#E2D2BE;margin:2px auto 14px}
.sheet h2{font-size:24px;text-align:center;margin-bottom:6px}
.sheet .sub{text-align:center;color:var(--ink-2);margin:0 0 18px}
.sheet.full{top:0;border-radius:0;max-height:none;max-width:none;padding-top:calc(env(safe-area-inset-top) + 8px + var(--top-extra))}
.sheet.full .inner{max-width:640px;margin:0 auto}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:800;font-size:15px;color:var(--ink-2);margin:0 0 6px 4px}
.input{width:100%;min-height:var(--tap);border-radius:16px;border:1.5px solid var(--line);background:#fff;padding:12px 16px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
textarea.input{min-height:96px;resize:vertical}
input[type=date].input,input[type=time].input{display:flex;align-items:center}
.seg{display:flex;gap:6px;padding:5px;border-radius:18px;background:rgba(120,80,40,.07);margin-bottom:14px}
.seg button{flex:1;min-height:48px;border-radius:14px;font-weight:800;font-size:16px;color:var(--ink-2);transition:all .3s var(--ease)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px -4px rgba(110,60,15,.25)}
.btnrow{display:flex;gap:10px;margin-top:18px}
.btnrow .btn{flex:1}
.stepdots{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.stepdots i{width:8px;height:8px;border-radius:9px;background:#E2D2BE;transition:all .35s var(--spring)}
.stepdots i.on{width:26px;background:var(--amber)}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet-head h2{flex:1;margin:0}
.step{animation:stepIn .4s var(--ease) both}
@keyframes stepIn{from{opacity:0;transform:translateX(24px)}}

/* Type grid */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:440px){.tgrid{grid-template-columns:repeat(3,1fr)}}

.tile .art{height:84px}.tile .art .big{font-size:44px;animation:none}
.tile .art .deco{display:none}
.tile b{display:block;font-size:15px;padding:8px 6px 2px;line-height:1.15}
.tile small{display:block;font-size:13px;color:var(--ink-3);font-weight:650;padding:0 6px 10px}
.grp{font-weight:850;font-size:16px;color:var(--ink-2);margin:18px 2px 10px}

/* Invite list, rows */
.rows{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:18px;background:rgba(255,255,255,.75);min-height:60px;text-align:left;width:100%}
.prow .n{flex:1;font-weight:750}
.prow .n small{display:block;font-size:14px;font-weight:600;color:var(--ink-3)}
.tick{width:32px;height:32px;border-radius:10px;border:2.5px solid #D9C7B1;display:grid;place-items:center;transition:all .3s var(--spring)}
.prow.on .tick{background:var(--amber);border-color:var(--amber)}

.warn{border-radius:20px;padding:16px;background:linear-gradient(145deg,#FFF3DC,#FFE7C4);border:1px solid #F5CF96;margin-top:14px;animation:cardIn .5s var(--spring) both}
.warn b{display:block;font-size:18px;margin-bottom:4px}
.summary{overflow:hidden}
.summary .art{height:130px}
.summary .body{padding:14px 16px;display:grid;gap:6px;font-size:16px}

.join{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 40px + var(--top-extra)) 20px 40px;text-align:center}

.join .lead{color:var(--ink-2);margin:6px 0 26px;font-size:18px}

.nametile small{font-size:13px;color:var(--ink-3);font-weight:700;display:flex;gap:4px;align-items:center}

.empty{text-align:center;padding:40px 20px}
.empty .e{font-size:64px;animation:bob 4s ease-in-out infinite}
.empty h3{margin:10px 0 6px;font-size:22px}

.past-toggle svg{transition:transform .3s var(--ease)}
.past-toggle.open svg{transform:rotate(90deg)}
.card.past{opacity:.75}
.list{padding:6px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px;min-height:60px;border-radius:16px;width:100%;text-align:left}

.stepper b{min-width:100px;text-align:center;font-size:20px}
.confetti{position:fixed;pointer-events:none;z-index:95;width:10px;height:14px;border-radius:3px}
.vers{text-align:center;color:var(--ink-3);font-size:13px;margin-top:24px}

class ApiError extends Error { constructor(s, m) { super(m); this.status = s; } }
async function api(action, body = {}) {
  let r;
  try {
    r = await fetch('/api/huddle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-huddle-token': S.token || '', 'x-huddle-version': APP_VERSION, ...(S.admin ? { 'x-huddle-admin': S.admin } : {}) },
      body: JSON.stringify({ action, ...body }),
    });
  } catch { throw new ApiError(0, 'offline'); }
  let data = {}; try { data = await r.json(); } catch {}
  if (r.status === 426) { showUpdate(); throw new ApiError(426, 'update_required'); }
  if (r.status === 401 && data.error === 'signed_out') { signOutLocal(); throw new ApiError(401, 'signed_out'); }
  if (!r.ok) throw new ApiError(r.status, data.error || 'error');
  return data;
}
const ERR = {

  bad_invite: "This invite link isn't working anymore. Ask Joe for the new one.", already_claimed: 'Someone already picked that name.', date_locked: 'The date was already locked in.',
  option_exists: 'That date is already an option.', not_allowed: "You can't do that one.", bad_passcode: 'Wrong passcode.', need_2_to_5_options: 'Offer 2 to 5 dates.',
  title_required: 'Give it a name first.', time_required: 'Pick a time.', update_required: 'Huddle just updated. Tap the banner to reload.', event_not_found: 'That event is gone.',
};
const errText = (e) => ERR[e.message] || 'Something went wrong. Try again.';
function toast(msg) { $$('.toast').forEach((t) => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
async function run(fn) { try { return await fn(); } catch (e) { if (e.status !== 401 && e.status !== 426) toast(errText(e)); return null; } }

/* ================= Sheets ================= */
function openSheet(html, { full = false, onClose } = {}) {
  closeSheet(true);
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sh = document.createElement('div'); sh.className = 'sheet' + (full ? ' full' : '');
  sh.innerHTML = (full ? '' : '<div class="grab"></div>') + html;
  scrim.onclick = () => closeSheet();
  document.body.append(scrim, sh);
  sh._onClose = onClose;
  // swipe down to close (non-full sheets)
  if (!full) {
    let y0 = null, dy = 0;
    sh.addEventListener('touchstart', (e) => { if (sh.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
    sh.addEventListener('touchmove', (e) => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
    sh.addEventListener('touchend', () => { if (y0 == null) return; if (dy > 110) closeSheet(); else sh.style.transform = ''; y0 = null; });
  }
  return sh;
}
function closeSheet(instant) {
  const sh = $('.sheet'), sc = $('.scrim');
  if (!sh) return;
  const cb = sh._onClose;
  if (instant) { sh.remove(); sc && sc.remove(); }
  else { sh.style.transform = ''; sh.classList.add('out'); sc && sc.classList.add('out'); setTimeout(() => { sh.remove(); sc && sc.remove(); }, 230); }
  cb && cb();
}
function confirmSheet(title, sub, okLabel, danger) {
  return new Promise((res) => {
    const sh = openSheet(`<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p><div class="btnrow"><button class="btn ghost" data-no>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(okLabel)}</button></div>`, { onClose: () => res(false) });
    $('[data-no]', sh).onclick = () => closeSheet();
    $('[data-yes]', sh).onclick = () => { sh._onClose = null; closeSheet(); res(true); };
  });
}

// PIN entry: big on-screen pad, or the phone's number keyboard ("Use Keyboard", remembered), or a real keyboard
function pinPad(title, sub, onDone) {
  const useKb = LS.get('huddle_pin_kb') === '1';
  const sh = openSheet(`<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p><div class="dots" style="position:relative"><i></i><i></i><i></i><i></i><input class="pinkb" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="PIN"></div><div class="err"></div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-n="${n}">${n}</button>`).join('')}<button class="blank" disabled></button><button data-n="0">0</button><button data-del aria-label="Delete">⌫</button></div>
    <button class="kbswitch" data-kb>${useKb ? 'Use Number Pad' : 'Use Keyboard'}</button>`, { onClose: () => document.removeEventListener('keydown', onKey) });
  let v = '', busy = false;
  const dots = $('.dots', sh), err = $('.err', sh), inp = $('.pinkb', sh), sw = $('[data-kb]', sh);
  const paint = () => { $$('i', dots).forEach((d, i) => d.classList.toggle('f', i < v.length)); if (inp.value !== v) inp.value = v; };
  const push = (val) => {
    if (busy) return;
    v = val.replace(/\D/g, '').slice(0, 4); paint(); err.textContent = '';
    if (v.length === 4) { const pin = v; busy = true; setTimeout(() => { busy = false; onDone(pin, api_); }, 150); }
  };
  const api_ = {
    reset(msg) { v = ''; paint(); if (msg) { err.textContent = msg; dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); } },
    set(t, s) { $('h2', sh).textContent = t; $('.sub', sh).textContent = s; err.textContent = ''; v = ''; paint(); },
  };
  const kbMode = (on, focus) => { sh.classList.toggle('kb', on); sw.textContent = on ? 'Use Number Pad' : 'Use Keyboard'; LS.set('huddle_pin_kb', on ? '1' : null); if (on && focus) inp.focus(); if (!on) inp.blur(); };
  $$('.pad button', sh).forEach((b) => (b.onclick = () => {
    if (b.dataset.del != null) return push(v.slice(0, -1));
    if (b.dataset.n != null && v.length < 4) push(v + b.dataset.n);
  }));
  inp.addEventListener('input', () => push(inp.value));
  dots.onclick = () => inp.focus();
  sw.onclick = () => kbMode(!sh.classList.contains('kb'), true);
  // A real keyboard (Mac, iPad keyboard) works anytime
  function onKey(e) {
    if (e.target === inp || !document.body.contains(sh)) return;
    if (/^\d$/.test(e.key) && v.length < 4) { e.preventDefault(); push(v + e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); push(v.slice(0, -1)); }
  }
  document.addEventListener('keydown', onKey);
  kbMode(useKb, useKb);
  return sh;
}
function pinFlow(id, name, claimed) {
  if (claimed) {
    pinPad(`Hi, ${name}`, 'Enter your 4-digit PIN.', async (pin, pad) => {
      try { const r = await api('signin', { k: S.k, person_id: id, pin }); await signedIn(r.token); }
      catch (e) { pad.reset(errText(e)); }
    });
  } else {
    let first = null;
    pinPad(`Hi, ${name}!`, 'Pick a 4-digit PIN you’ll remember.', async (pin, pad) => {
      if (!first) { first = pin; pad.set('One More Time', 'Type the same PIN again.'); return; }
      if (pin !== first) { first = null; pad.set(`Hi, ${name}!`, 'Pick a 4-digit PIN you’ll remember.'); pad.reset("Those didn't match. Try again."); return; }
      try { const r = await api('claim', { k: S.k, person_id: id, pin }); await signedIn(r.token, true); }
      catch (e) { pad.reset(errText(e)); first = null; }
    });
  }
}

async function boot() {
  const d = await api('boot', { standalone: isStandalone() });
  S.me = d.me; S.people = d.people; S.events = d.events; S.deps = d.dependents; S.defaultLead = d.default_lead_days; S.today = d.today;
  if (d.version && d.version !== APP_VERSION) showUpdate();
  syncAvatars();
}
function saveAvatars() { try { localStorage.setItem('huddle_avatars', JSON.stringify(S.avatars)); } catch {} }
async function syncAvatars(extra = []) {
  const want = {};
  for (const p of S.people) if (p.avatar_v) want[p.id] = p.avatar_v;
  for (const p of extra) if (p.avatar_v) want[p.id] = p.avatar_v;
  let changed = false;
  for (const id of Object.keys(S.avatars)) { const p = S.people.find((x) => x.id === id); if (p && !p.avatar_v) { delete S.avatars[id]; changed = true; } }
  const need = Object.keys(want).filter((id) => !S.avatars[id] || S.avatars[id].v !== want[id]);
  if (need.length) {
    try {
      const r = await api('avatar_get', { ids: need });
      for (const a of r.avatars) { S.avatars[a.person_id] = { v: a.updated_at, data: a.data }; changed = true; }
    } catch {}
  }
  if (changed) { saveAvatars(); if (!$('.sheet') && route().view !== 'e') render(); else if (route().view === 'e' && S.tab === 'details' && !$('.sheet')) render(); }
}
async function refresh() { if (!S.token) return; await run(boot); if (!$('.sheet') && route().view !== 'e') render(); else if (route().view === 'e' && S.tab === 'details' && !$('.sheet')) render(); }

  $$('[data-g]', sh).forEach((b) => (b.onclick = () => { b.classList.toggle('on'); g[b.classList.contains('on') ? 'add' : 'delete'](b.dataset.g); }));
  $('[data-s]', sh).onclick = async () => {
    const body = { id: p.id || undefined, name: $('#pn', sh).value, bday_month: $('#pm', sh).value, bday_day: $('#pd', sh).value, has_account: hasAcc, partner_id: $('#pp', sh).value || null, guardians: hasAcc ? [] : [...g] };
    const r = await run(() => api('admin_save_person', body)); if (!r) return;
    for (const inp of $$('[data-ov]', sh)) { if (inp.value.trim() !== ovr(inp.dataset.ov)) await run(() => api('admin_set_override', { subject_id: r.id, viewer_id: inp.dataset.ov, name: inp.value.trim() })); }
    closeSheet(); toast('Saved.'); await reloadAdmin();
  };
  const rs = $('[data-reset]', sh); if (rs) rs.onclick = async () => { if (!(await confirmSheet(`Reset ${p.name}’s PIN?`, 'They’ll pick a new PIN from the invite link. They get signed out on every phone.', 'Reset PIN', true))) return; if (await run(() => api('admin_reset_pin', { id: p.id }))) { toast('PIN reset.'); reloadAdmin(); } };
  const rm = $('[data-rm]', sh); if (rm) rm.onclick = async () => { if (!(await confirmSheet(`Remove ${p.name}?`, 'They disappear from new events and get signed out. Their old answers and messages stay. You can restore them later.', 'Remove', true))) return; if (await run(() => api('admin_remove_person', { id: p.id }))) { toast('Removed.'); reloadAdmin(); } };
  const re = $('[data-restore]', sh); if (re) re.onclick = async () => { if (await run(() => api('admin_restore_person', { id: p.id }))) { closeSheet(); toast('Restored.'); reloadAdmin(); } };
}
async function reloadAdmin() { const d = await run(() => api('admin_data')); if (d) { AD = d; await syncAvatars(AD.people); } await run(boot); if (route().view === 'admin') paintAdmin(); }

/* ================= Calendar feed ================= */
// One private, live link per person: every event they're invited to with a locked date (minus "Can't Make It")
async function calendarSheet() {
  const r = await run(() => api('cal_link'));
  if (!r) return;
  const path = `${location.host}/cal/${r.token}.ics`;
  const webcal = `webcal://${path}`, https = `https://${path}`;
  const google = `https://calendar.google.com/calendar/r?cid=${encodeURIComponent(webcal)}`;
  const sh = openSheet(`<h2>Add Huddle to Your Calendar</h2><p class="sub">Every get-together you’re invited to shows up in your calendar. Date changes, new times and cancellations update on their own.</p>
    <div class="btnrow" style="flex-direction:column;margin-top:4px">
      <a class="btn primary block" href="${webcal}">${I.cal} Apple Calendar</a>
      <a class="btn ghost block" href="${google}" target="_blank" rel="noopener">Google Calendar</a>
      <button class="btn ghost block" data-copy>Copy Link (Outlook, Others)</button>
    </div>
    <div class="notes" style="margin-top:16px;font-size:15px;line-height:1.45;background:rgba(255,255,255,.6);padding:12px 14px;border-radius:14px">
      <b>Apple:</b> tap Subscribe. Changes show up within about an hour.<br>
      <b>Google:</b> open this on a computer and click Add. Google only checks every several hours, so changes can take up to a day.<br>
      Events you answer “Can’t Make It” drop off your calendar. Dates still being voted on show up once they’re locked in.
    </div>
    <button class="kbswitch" data-reset style="color:var(--ink-3);font-size:14px">Make a New Private Link</button>`);
  $('[data-copy]', sh).onclick = async () => { try { await navigator.clipboard.writeText(https); toast('Calendar link copied.'); } catch { toast(https); } };
  $('[data-reset]', sh).onclick = async () => {
    closeSheet(true);
    if (!(await confirmSheet('Make a New Link?', 'Calendars using the old link stop updating. You’ll need to add Huddle to them again.', 'New Link', true))) return;
    if (await run(() => api('cal_link', { reset: true }))) { toast('New link made.'); calendarSheet(); }
  };
}

/* ================= Photos ================= */
function photoSheet(pid, name, after) {
  const p = person(pid) || (AD && AD.people.find((x) => x.id === pid)) || {};
  const sh = openSheet(`<h2>${isMe(pid) ? 'Your Photo' : esc(name) + '’s Photo'}</h2><p class="sub">Everyone in the family sees it.</p>
    <div style="margin:6px 0 18px">${avHTML(pid, name, p.avatar_v, 'xl')}</div>
    <div class="btnrow" style="flex-direction:column"><button class="btn primary block" data-pick>${p.avatar_v ? 'Choose a New Photo' : 'Choose a Photo'}</button>${p.avatar_v ? '<button class="btn danger block" data-rm>Remove Photo</button>' : ''}</div>`);
  $('[data-pick]', sh).onclick = () => pickImage((img) => cropSheet(img, pid, after));
  const rm = $('[data-rm]', sh);
  if (rm) rm.onclick = async () => { const r = await run(() => api('avatar_set', { person_id: pid, data: null })); if (r) { applyAvatar(pid, null); closeSheet(); toast('Photo removed.'); after && after(); } };
}
// Must run inside the tap so iOS opens the photo picker
function pickImage(cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.style.cssText = 'position:fixed;left:-999px;top:0'; document.body.appendChild(inp);
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    const url = URL.createObjectURL(f); const img = new Image();
    img.onload = () => cb(img, url); img.onerror = () => toast('That photo couldn’t be opened. Try another one.');
    img.src = url;
  };
  inp.click();
}
// Drag to move, slider (or pinch) to zoom, saved as a 320px square JPEG
function cropSheet(img, pid, after) {
  const sh = openSheet(`<h2>Move and Zoom</h2><p class="sub">Drag the photo to center the face.</p><div class="crop" id="crop"></div>
    <input class="zoom" id="zm" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
    <div class="btnrow"><button class="btn ghost" data-c>Cancel</button><button class="btn primary" data-s>Use Photo</button></div>`);
  const box = $('#crop', sh); box.appendChild(img);
  const D = 260, W = img.naturalWidth, H = img.naturalHeight, base = D / Math.min(W, H);
  let z = 1, x = (D - W * base) / 2, y = (D - H * base) / 2;
  const clamp = () => { const s = base * z; x = Math.min(0, Math.max(D - W * s, x)); y = Math.min(0, Math.max(D - H * s, y)); };
  const paint = () => { clamp(); img.style.transform = `translate(${x}px,${y}px) scale(${base * z})`; };
  const zoomTo = (nz) => { const s0 = base * z; const cx = (D / 2 - x) / s0, cy = (D / 2 - y) / s0; z = Math.min(4, Math.max(1, nz)); const s1 = base * z; x = D / 2 - cx * s1; y = D / 2 - cy * s1; $('#zm', sh).value = z; paint(); };
  paint();
  const pts = new Map(); let pinch0 = null;
  box.addEventListener('pointerdown', (e) => { box.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
  box.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0) zoomTo(z * d / pinch0); pinch0 = d; return; }
    x += e.clientX - prev.x; y += e.clientY - prev.y; paint();
  });
  const up = (e) => { pts.delete(e.pointerId); pinch0 = null; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  $('#zm', sh).oninput = (e) => zoomTo(Number(e.target.value));
  $('[data-c]', sh).onclick = () => closeSheet();
  $('[data-s]', sh).onclick = async (e) => {
    e.target.disabled = true;
    const c = document.createElement('canvas'); c.width = c.height = 320; const k = 320 / D; const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high'; g.drawImage(img, x * k, y * k, W * base * z * k, H * base * z * k);
    let data = c.toDataURL('image/jpeg', 0.85); if (data.length > 150000) data = c.toDataURL('image/jpeg', 0.7);
    const r = await run(() => api('avatar_set', { person_id: pid, data }));
    e.target.disabled = false; if (!r) return;
    applyAvatar(pid, r.avatar_v, data); URL.revokeObjectURL(img.src); closeSheet(); toast('Photo saved.'); after && after();
  };
}
function applyAvatar(pid, v, data) {
  for (const list of [S.people, AD ? AD.people : []]) { const p = list.find((x) => x.id === pid); if (p) p.avatar_v = v; }
  if (S.me && pid === S.me.id) S.me.avatar_v = v;
  if (v) S.avatars[pid] = { v, data }; else delete S.avatars[pid];
  saveAvatars();
}

/* ================= Fun ================= */
function burst(el) {
  if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cols = ['#E8913A', '#3F9663', '#F2C14E', '#D6578A', '#5B8FD6'];
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('i'); c.className = 'confetti'; c.style.background = cols[i % cols.length]; c.style.left = cx + 'px'; c.style.top = cy + 'px'; document.body.appendChild(c);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 110;
    c.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 80}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => c.remove();
  }
}

/* ================= Start ================= */
async function start() {
  if (S.token) {
    try { await boot(); } catch (e) { if (e.status === 0) { $('#app').innerHTML = `<div class="join view"><div class="mark">${I.huddle(52)}</div><h1>Can’t Connect</h1><p class="lead">Check your connection and try again.</p><button class="btn primary" onclick="location.reload()">Try Again</button></div>`; return; } }
  }
  if (S.token && S.k && !location.search.includes('k=')) history.replaceState(null, '', '/?k=' + encodeURIComponent(S.k) + location.hash);
  render();
  checkVersion();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkVersion(); refresh(); } });
setInterval(() => { if (!document.hidden && S.me && route().view === 'home' && !$('.sheet')) refresh(); }, 60000);
if ('serviceWorker' in navigator && location.hostname !== 'localhost') navigator.serviceWorker.register('/sw.js').catch(() => {});
start();
</script>
